<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Nuage product sourcing pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Product sourcing pipeline</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Schedules are defined in vercel.json (cron expressions, UTC). Publishing requires an approved draft.</text>

  <rect x="25" y="100" width="170" height="115" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="110" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">1. Scrape</text>
  <text x="110" y="148" text-anchor="middle" font-size="11" fill="#3730a3">/api/cron/scrape</text>
  <text x="110" y="166" text-anchor="middle" font-size="11" fill="#3730a3">daily 00:00</text>
  <text x="110" y="186" text-anchor="middle" font-size="11" fill="#4338ca">SCRAPE_URLS, Playwright</text>
  <text x="110" y="201" text-anchor="middle" font-size="11" fill="#4338ca">+ Cheerio adapters</text>

  <rect x="225" y="100" width="170" height="115" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="310" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">2. Draft</text>
  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#3730a3">createDraftFromScraped</text>
  <text x="310" y="164" text-anchor="middle" font-size="11" fill="#3730a3">Product()</text>
  <text x="310" y="186" text-anchor="middle" font-size="11" fill="#4338ca">images uploaded to</text>
  <text x="310" y="201" text-anchor="middle" font-size="11" fill="#4338ca">Supabase Storage</text>

  <rect x="425" y="100" width="170" height="115" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="510" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">3. AI translation</text>
  <text x="510" y="148" text-anchor="middle" font-size="11" fill="#3730a3">/api/cron/curate</text>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#3730a3">daily 02:00</text>
  <text x="510" y="186" text-anchor="middle" font-size="11" fill="#4338ca">batch of 5 drafts per run</text>
  <text x="510" y="201" text-anchor="middle" font-size="11" fill="#4338ca">via OpenRouter</text>

  <rect x="625" y="100" width="140" height="115" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="695" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">4. Review</text>
  <text x="695" y="150" text-anchor="middle" font-size="11" fill="#92400e">Admin edits and</text>
  <text x="695" y="166" text-anchor="middle" font-size="11" fill="#92400e">approves the draft</text>
  <text x="695" y="186" text-anchor="middle" font-size="11" fill="#92400e">(/admin)</text>

  <rect x="795" y="100" width="140" height="115" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="865" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">5. Publish</text>
  <text x="865" y="150" text-anchor="middle" font-size="11" fill="#166534">publishDraft()</text>
  <text x="865" y="168" text-anchor="middle" font-size="11" fill="#166534">new products row,</text>
  <text x="865" y="184" text-anchor="middle" font-size="11" fill="#166534">translated reviews</text>
  <text x="865" y="200" text-anchor="middle" font-size="11" fill="#166534">copied over</text>

  <path d="M195 157H222" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M395 157H422" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M595 157H622" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M765 157H792" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="225" y="260" width="370" height="80" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="410" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Review translation</text>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#475569">/api/cron/translate-reviews, daily 04:00 (OpenRouter)</text>
  <text x="410" y="324" text-anchor="middle" font-size="11" fill="#475569">translated reviews are what publishDraft() copies</text>
  <rect x="625" y="260" width="310" height="80" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="780" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Email campaigns</text>
  <text x="780" y="308" text-anchor="middle" font-size="11" fill="#475569">/api/cron/email-campaigns, Mondays 10:00</text>
  <text x="780" y="324" text-anchor="middle" font-size="11" fill="#475569">separate job on the same scheduler</text>
</svg>
